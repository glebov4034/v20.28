name: Build Windows EXE v20.27 FIXED
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      - name: Verify corrected source
        shell: pwsh
        run: |
          python -m py_compile LED_Screen_Designer_v20_27.py
          python -c "from pathlib import Path; s=Path('LED_Screen_Designer_v20_27.py').read_text(encoding='utf-8'); assert 'Fail-safe: приложение должно запуститься даже при ошибке стартового диалога.' not in s; print('v20.27 ACTUAL SOURCE FIX: OK')"
      - name: Build
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name "LED_Screen_Designer_v20_27" `
            --collect-all tkinterdnd2 `
            --collect-all fitz `
            --collect-all PIL `
            "LED_Screen_Designer_v20_27.py"
      - name: Restore Tcl Tk runtime
        shell: pwsh
        run: |
          $tcl = python -c "import tkinter, pathlib; print(pathlib.Path(tkinter.Tcl().eval('info library')).parent)"
          $tk = python -c "import tkinter, pathlib; t=tkinter.Tk(); print(pathlib.Path(t.tk.eval('set tk_library'))); t.destroy()"
          $internal = "dist\LED_Screen_Designer_v20_27\_internal"
          New-Item -ItemType Directory -Force "$internal\_tcl_data" | Out-Null
          New-Item -ItemType Directory -Force "$internal\_tk_data" | Out-Null
          Copy-Item "$tcl\*" "$internal\_tcl_data" -Recurse -Force
          Copy-Item "$tk\*" "$internal\_tk_data" -Recurse -Force
          if (!(Test-Path "$internal\_tcl_data\init.tcl")) { throw "init.tcl missing" }
          if (!(Test-Path "$internal\_tk_data\tk.tcl")) { throw "tk.tcl missing" }
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LED_Screen_Designer_v20_27_Windows_ACTUAL_FIX
          path: dist/LED_Screen_Designer_v20_27/
          if-no-files-found: error
